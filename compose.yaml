services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: objectstore
      POSTGRES_PASSWORD: objectstore
      POSTGRES_DB: objectstore
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U objectstore -d objectstore"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
