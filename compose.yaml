services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: objectstore
      POSTGRES_PASSWORD: objectstore
      POSTGRES_DB: objectstore
    ports:
      - "15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U objectstore -d objectstore"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  objectstore:
    image: objectstore:pg
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OBJECTSTORE_DATABASE_URL: postgres://objectstore:objectstore@postgres:5432/objectstore
    ports:
      - "8080:8080"
    volumes:
      - objdata:/data

volumes:
  pgdata:
  objdata:
